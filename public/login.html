<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Faculty Research Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }

    .orb-1 {
      width: 350px;
      height: 350px;
      background: rgba(99, 102, 241, 0.25);
      top: 10%;
      left: 15%;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(56, 189, 248, 0.2);
      bottom: 10%;
      right: 15%;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 45px 40px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px var(--primary-glow);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 26px;
      color: #fff;
      box-shadow: 0 10px 20px var(--primary-glow);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      transition: color 0.3s;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
      background: rgba(15, 23, 42, 0.8);
    }

    .form-input:focus + .input-icon {
      color: var(--accent);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert.show {
      display: flex;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(99, 102, 241, 0.5);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Password toggle button */
    .btn-toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
      line-height: 1;
    }
    .btn-toggle-pw:hover { color: var(--accent); }

    .quick-logins {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--glass-border);
      text-align: center;
    }

    .quick-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .quick-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-quick {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-quick:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="brand-title">Faculty Portal</h1>
      <p class="brand-subtitle">Research, Publications & Grants Management</p>
    </div>

    <div id="alertBox" class="alert alert-error">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="alertMsg">Invalid email or password</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="form-input" placeholder="name@college.edu" required autocomplete="email">
          <i class="fa-solid fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 44px;">
          <i class="fa-solid fa-lock input-icon"></i>
          <button type="button" class="btn-toggle-pw" id="togglePw" aria-label="Toggle password visibility" title="Show / hide password">
            <i class="fa-solid fa-eye" id="togglePwIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span>Sign In to Portal</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="quick-logins">
      <p class="quick-title">Quick Demo Login</p>
      <div class="quick-buttons">
        <button type="button" class="btn-quick" onclick="fillCredentials('admin@college.edu', 'Admin@123')">
          <i class="fa-solid fa-user-shield" style="color: #a855f7;"></i> Admin
        </button>
        <button type="button" class="btn-quick" onclick="fillCredentials('arjun.mehta@college.edu', 'Faculty@123')">
          <i class="fa-solid fa-user-tie" style="color: #38bdf8;"></i> Faculty
        </button>
      </div>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('accessToken')) {
      window.location.href = './index.html';
    }

    // Password show/hide toggle
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const icon = document.getElementById('togglePwIcon');
      const isHidden = pw.type === 'password';
      pw.type = isHidden ? 'text' : 'password';
      icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    function showAlert(msg) {
      document.getElementById('alertMsg').textContent = msg;
      document.getElementById('alertBox').classList.add('show');
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.remove('show');
    }

    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      hideAlert();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');

      // Client-side validation
      if (!email || !password) {
        showAlert('Please enter your email and password.');
        return;
      }

      hideAlert();
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner spinner"></i> Authenticating...`;

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('accessToken', data.data.accessToken);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          window.location.href = './index.html';
        } else {
          showAlert(data.message || 'Login failed. Please check credentials.');
        }
      } catch (err) {
        showAlert('Server connection error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In to Portal</span><i class="fa-solid fa-arrow-right"></i>`;
      }
    });
  </script>
</body>
</html>
